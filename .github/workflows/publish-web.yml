name: Publish Cineva web app

on:
  push:
    branches: [master]
    paths:
      - "Web/**"
      - ".github/workflows/publish-web.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node for shell checks
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify every app stylesheet and script is precached
        run: node Web/scripts/check-shell.mjs
      - name: Smoke test built web app in headless Chrome
        run: node Web/tests/browser-smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
